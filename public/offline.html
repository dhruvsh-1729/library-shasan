<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Granth Library</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7fafc; color: #17211f; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 26rem; padding: 24px 16px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: #43504d; }
  button { min-height: 44px; padding: 8px 18px; border: 0; border-radius: 8px; background: #17211f; color: #fff; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>No internet connection</h1>
  <p>This page has not been opened on this device before, so it is not saved here. Pages and searches you opened earlier still open without internet.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
